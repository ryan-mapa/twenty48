<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="apple-touch-icon" href="./assets/favicon.png">
    <meta name="theme-color" content="#e1efc7">

    <link href="https://fonts.googleapis.com/css?family=Noto+Sans:700&display=swap" rel="stylesheet">
    <script type="module" src="./2048.js"></script>
    <link rel="stylesheet" href="./style.css">
    <title>SUSHI48</title>
</head>
<body>
    <div class="game-header">
        <h1>
            <img src="./assets/chopsticks.png" alt="" class="logo" width="170" height="176">
            <span>SUSHI<span class="red">48</span></span>
        </h1>
        <div id="auth" class="auth"></div>
    </div>

    <div class="layout">
        <div class="board-column">
            <div class="board-bar">
                <div class="score-counter"><div>SCORE</div><div id="score">0</div></div>
                <button type="button" id="restart" class="button">NEW GAME</button>
            </div>
            <div id='g2048'></div>
        </div>

        <aside class="leaderboard">
            <h2>LEADERBOARD</h2>
            <p id="leaderboard-status" class="leaderboard-status">Loading…</p>
            <ol id="leaderboard-list"></ol>
        </aside>
    </div>

    <h3 class="footer">Art by:&nbsp<a target='_blank' href="https://www.robynhwang.com/">Robyn Hwang</a></h3>
    <p class="footer-links">
        <a href="./privacy">Privacy</a> ·
        <a href="./terms">Terms</a> ·
        <a href="https://github.com/ryan-mapa/twenty48" target="_blank" rel="noopener">Source on GitHub</a>
    </p>

    <div id="gameover" class="overlay" hidden>
        <div class="overlay-card">
            <h2>GAME OVER</h2>
            <p class="final-score">SCORE <span id="final-score">0</span></p>

            <div id="name-field" class="name-field">
                <label for="player-name">POST AS</label>
                <input type="text" id="player-name" maxlength="20"
                       placeholder="your name" autocomplete="nickname" spellcheck="false">
            </div>

            <p id="overlay-status" class="overlay-status"></p>

            <div class="overlay-actions">
                <button type="button" id="post-score" class="button">POST TO LEADERBOARD</button>
                <button type="button" id="play-again" class="button">PLAY AGAIN</button>
            </div>

            <p class="overlay-signin-note">or claim your name</p>
            <div class="overlay-signin" id="overlay-signin"></div>
        </div>
    </div>
</body>
</html>
